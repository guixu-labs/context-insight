[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentlineage-core"
version = "0.1.0a10"
readme = "README.md"
description = "Native agent-session evidence, historical inquiry and repair lineage"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6,<7"]

[project.optional-dependencies]
mcp = ["mcp>=1.30,<2"]

[project.scripts]
agentlineage = "agentlineage_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"agentlineage_core.inquiry" = ["*.html", "*.js"]
"agentlineage_core" = ["py.typed"]
