[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["components/core/src", "components/learning/src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".work", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
files = ["components/core/src/agentlineage_core", "components/learning/src/agentlineage_learning"]
ignore_missing_imports = true
check_untyped_defs = true
