name: Release Dry Run

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/release-dry-run.yml"
      - ".github/workflows/release-publish.yml"
      - ".npmignore"
      - "bin/**"
      - "next.config.ts"
      - "package.json"
      - "prisma/**"
      - "public/**"
      - "scripts/build-cli.mjs"
      - "scripts/build-export-view.mjs"
      - "scripts/build-guard.mjs"
      - "scripts/ensure-test-db.mjs"
      - "scripts/pack-cannbot.mjs"
      - "scripts/release/**"
      - "src/cli/index.ts"
      - "src/export-view/**"
      - "src/lib/branding.ts"
      - "src/lib/version.ts"
      - "tests/e2e/boot/boot-server.sh"
      - "tests/pipeline/cannbot-pack.test.ts"
      - "tests/pipeline/npm-publish.test.ts"
      - "tsconfig.json"

permissions:
  contents: read

concurrency:
  group: release-dry-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          registry-url: "https://registry.npmjs.org/"

      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Apply automatic beta version
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          BETA_VERSION=$(node scripts/release/prepare-beta-version.mjs --print)
          echo "beta version: $BETA_VERSION"
          node scripts/release/prepare-beta-version.mjs --version "$BETA_VERSION"

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint release changes
        run: npx eslint scripts/release tests/pipeline/npm-publish.test.ts tests/pipeline/cannbot-pack.test.ts

      - name: Prepare test database
        run: node scripts/ensure-test-db.mjs

      - name: Release packaging tests
        run: npx vitest run tests/pipeline/npm-publish.test.ts tests/pipeline/cannbot-pack.test.ts

      - name: Browser E2E
        run: npm run e2e

      - name: Build release artifacts
        run: npm run release:prepare

      - name: Verify release artifacts
        run: npm run release:verify

      - name: Generate checksums
        run: sha256sum release-artifacts/*.tgz > release-artifacts/SHA256SUMS

      - name: Upload release candidates
        uses: actions/upload-artifact@v4
        with:
          name: release-candidates
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 7

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
