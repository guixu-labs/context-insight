name: UT CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ut-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  logic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Pure logic tests
        run: npm run test:ut:pure

      - name: Fixture logic tests
        run: npm run test:ut:fixture
